                <button onclick="toggleCardAnswer('task4-ans')" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-amber-400 border border-slate-700 text-xs font-medium rounded-lg transition">
                  Toggle Model Transcript
                </button>
              </div>
            </div>

            <div class="p-4 rounded-xl bg-slate-900/70 border border-slate-800">
              <div class="text-xs font-bold uppercase tracking-wider text-amber-400 mb-1.5">Live Spontaneous Prompt</div>
              <blockquote class="text-sm font-medium text-slate-200 border-l-2 border-amber-500 pl-3 py-1 mb-4 italic">
                "${w.tasks.task4.prompt}"
              </blockquote>

              <!-- Live In-Browser Audio Recording Booth -->
              <div class="p-4 rounded-xl bg-slate-950 border border-rose-500/30 mb-4 text-center">
                <div class="flex items-center justify-between gap-2 mb-2">
                  <span class="text-xs font-bold text-rose-400 flex items-center gap-1.5">
                    <span class="w-2.5 h-2.5 rounded-full bg-rose-500 animate-pulse"></span>
                    Live Audio Recording Booth
                  </span>
                  <span id="portalRecBadge" class="hidden px-2 py-0.5 rounded-full bg-rose-500 text-white font-mono text-[10px] font-bold">REC LIVE</span>
                </div>
                <div class="text-3xl font-mono font-bold text-slate-200 my-2" id="portalRecTimer">00:00</div>
                <p class="text-xs text-slate-400 mb-3" id="portalRecStatus">Click "Start Recording" to capture your speech directly in the browser.</p>
                
                <div class="flex flex-wrap items-center justify-center gap-2">
                  <button id="portalRecordBtn" onclick="togglePortalAudioRecording()" class="px-5 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs shadow-md transition flex items-center gap-2">
                    <span id="portalRecordIcon" class="w-2.5 h-2.5 rounded-full bg-white"></span>
                    <span id="portalRecordText">Start Recording</span>
                  </button>
                  <button id="portalResetBtn" onclick="resetPortalAudioRecording()" class="hidden px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium transition">
                    Reset
                  </button>
                </div>

                <!-- Audio Playback & Download -->
                <div id="portalAudioContainer" class="hidden mt-4 pt-3 border-t border-slate-800 flex flex-col items-center space-y-2.5">
                  <span class="text-xs text-emerald-400 font-semibold">✓ Audio Captured! Listen to your pronunciation:</span>
                  <audio id="portalAudioPlayback" controls class="w-full max-w-sm rounded bg-slate-900 border border-slate-800"></audio>
                  <div class="flex items-center gap-2">
                    <a id="portalDownloadLink" download="Alicia_Week${w.week}_Spontaneous_Sprint.webm" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg text-xs flex items-center gap-1.5 shadow transition">
                      ⬇️ Download Audio File
                    </a>
                  </div>
                </div>
              </div>

              <!-- Preply Upload Guide -->
              <div class="p-4 rounded-xl bg-[#0b101d] border border-sky-500/30 mb-4">
                <div class="flex items-center justify-between flex-wrap gap-2 mb-2">
                  <span class="text-xs font-bold text-white flex items-center gap-1.5">
                    <span class="w-5 h-5 rounded-md bg-sky-500/20 text-sky-400 flex items-center justify-center text-[10px]">📎</span>
                    How to Upload Audio to Preply (3 Steps)
                  </span>
                  <a href="https://preply.com/messages" target="_blank" rel="noopener noreferrer" class="px-2.5 py-1 bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold text-[11px] rounded transition">
                    Open Preply Messages &nearr;
                  </a>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 text-[11px] text-slate-300 mb-2">
                  <div class="p-2 rounded-lg bg-slate-900 border border-slate-800">
                    <span class="font-bold text-sky-400">1. Download:</span> Save your audio file above.
                  </div>
                  <div class="p-2 rounded-lg bg-slate-900 border border-slate-800">
                    <span class="font-bold text-sky-400">2. Open Preply:</span> Go to messages with Lewis O.
                  </div>
                  <div class="p-2 rounded-lg bg-slate-900 border border-slate-800">
                    <span class="font-bold text-sky-400">3. Attach:</span> Click the paperclip (📎) and send!
                  </div>
                </div>
                <div class="flex items-center justify-between p-2 rounded bg-slate-950 border border-slate-800 text-[11px] text-slate-400">
                  <span>Note: <em>"Hi Lewis! Here is my Week ${w.week} spontaneous sprint. Looking forward to your feedback!"</em></span>
                  <button onclick="copyPortalNote(${w.week})" id="portalCopyBtn" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 text-sky-300 rounded text-[10px] ml-2">📋 Copy</button>
                </div>
              </div>

              <div id="task4-ans" class="task4-ans ${globalReveal ? 'block' : 'hidden'} p-4 rounded-xl bg-slate-950 border border-slate-800 mt-3">
                <div class="flex items-center justify-between mb-2">
                  <span class="text-xs font-bold text-emerald-400">Model Native Speaker Transcript (SSBE Flow):</span>
                  <span class="text-xs text-slate-400 font-mono">Continuous Cadence</span>
                </div>
                <p class="text-xs text-slate-300 leading-relaxed italic whitespace-pre-line">
                  "${w.tasks.task4.modelTranscript}"
                </p>
              </div>
            </div>
          </div>

        </div>
      `;

      loadSavedAnswers();
    }

    function toggleCardAnswer(className) {
      const els = document.querySelectorAll('.' + className);
      els.forEach(el => el.classList.toggle('hidden'));
    }

    function toggleGlobalAnswers() {
      globalReveal = !globalReveal;
      document.getElementById('modeText').innerText = globalReveal ? 'Hide Answers' : 'Reveal All Answers';
      document.getElementById('modeIcon').innerText = globalReveal ? '🙈' : '👁️';
      
      const allAnswers = document.querySelectorAll('.task1-ans, .task3-ans, .task4-ans');
      allAnswers.forEach(el => {
        if (globalReveal) {
          el.classList.remove('hidden');
        } else {
          el.classList.add('hidden');
        }
      });
    }

    // Local Storage for persistence
    function saveStudentInput(key, val) {
      localStorage.setItem('alicia_hw_' + key, val);
    }

    function saveChecklist(key, checked) {
      localStorage.setItem('alicia_hw_' + key, checked ? 'true' : 'false');
    }

    function loadSavedAnswers() {
      document.querySelectorAll('input[type="text"], textarea').forEach(el => {
        const val = localStorage.getItem('alicia_hw_' + el.id);
        if (val) el.value = val;
      });

      document.querySelectorAll('input[type="checkbox"]').forEach(el => {
        const val = localStorage.getItem('alicia_hw_' + el.id);
        if (val === 'true') el.checked = true;
      });
    }

    // Timer Logic
    function toggleTimerModal() {
      const modal = document.getElementById('timerModal');
      modal.classList.toggle('hidden');
    }

    function setTimerDuration(sec) {
      timerSeconds = sec;
      updateTimerDisplay();
      if (isTimerRunning) toggleTimer();
    }

    function startSprintForWeek(sec) {
      const modal = document.getElementById('timerModal');
      modal.classList.remove('hidden');
      setTimerDuration(sec);
      toggleTimer();
    }

    function updateTimerDisplay() {
      const mins = Math.floor(timerSeconds / 60);
      const secs = timerSeconds % 60;
      document.getElementById('timerDisplay').innerText = 
        String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
    }

    function toggleTimer() {
      const btn = document.getElementById('startTimerBtn');
      if (isTimerRunning) {
        clearInterval(timerInterval);
        isTimerRunning = false;
        btn.innerText = 'Resume';
        btn.classList.remove('bg-rose-500');
        btn.classList.add('bg-amber-500');
      } else {
        isTimerRunning = true;
        btn.innerText = 'Pause';
        btn.classList.remove('bg-amber-500');
        btn.classList.add('bg-rose-500');
        
        timerInterval = setInterval(() => {
          if (timerSeconds > 0) {
            timerSeconds--;
            updateTimerDisplay();
          } else {
            clearInterval(timerInterval);
            isTimerRunning = false;
            btn.innerText = 'Finished!';
            alert("⏰ Time's up! Conclude your sentence and review your delivery.");
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isTimerRunning = false;
      timerSeconds = 60;
      updateTimerDisplay();
      const btn = document.getElementById('startTimerBtn');
      btn.innerText = 'Start Sprint';
      btn.classList.remove('bg-rose-500');
      btn.classList.add('bg-amber-500');
    }

    // Portal Live Audio Recorder Logic
    let portalMediaRecorder = null;
    let portalAudioChunks = [];
    let portalRecordInterval = null;
    let portalRecordSeconds = 0;
    let isPortalRecording = false;

    async function togglePortalAudioRecording() {
      if (!isPortalRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          let mimeType = 'audio/webm';
          if (!MediaRecorder.isTypeSupported('audio/webm')) {
            if (MediaRecorder.isTypeSupported('audio/mp4')) mimeType = 'audio/mp4';
            else mimeType = '';
          }
          portalMediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
          portalAudioChunks = [];

          portalMediaRecorder.ondataavailable = e => {
            if (e.data && e.data.size > 0) portalAudioChunks.push(e.data);
          };

          portalMediaRecorder.onstop = () => {
            const blobType = portalMediaRecorder.mimeType || 'audio/webm';
            const audioBlob = new Blob(portalAudioChunks, { type: blobType });
            const audioUrl = URL.createObjectURL(audioBlob);

            const playback = document.getElementById('portalAudioPlayback');
            playback.src = audioUrl;

            const downloadLink = document.getElementById('portalDownloadLink');
            downloadLink.href = audioUrl;

            document.getElementById('portalAudioContainer').classList.remove('hidden');
            document.getElementById('portalRecStatus').innerText = '✓ Recording complete. Listen or download below to upload to Preply!';
            
            stream.getTracks().forEach(track => track.stop());
          };

          portalMediaRecorder.start();
          isPortalRecording = true;
          portalRecordSeconds = 0;
          updatePortalRecordDisplay();

          document.getElementById('portalRecBadge').classList.remove('hidden');
          document.getElementById('portalResetBtn').classList.remove('hidden');
          document.getElementById('portalAudioContainer').classList.add('hidden');

          const btn = document.getElementById('portalRecordBtn');
          btn.classList.remove('bg-rose-600', 'hover:bg-rose-500');
          btn.classList.add('bg-amber-500', 'hover:bg-amber-400', 'text-slate-950');
          document.getElementById('portalRecordText').innerText = 'Stop Recording';
          document.getElementById('portalRecordIcon').classList.add('rounded-sm');
          document.getElementById('portalRecStatus').innerText = '🔴 Recording live audio... Speak naturally!';

          portalRecordInterval = setInterval(() => {
            portalRecordSeconds++;
            updatePortalRecordDisplay();
          }, 1000);
        } catch (err) {
          console.error(err);
          alert('Microphone access is required to record audio. Please allow microphone permissions in your browser.');
        }
      } else {
        if (portalMediaRecorder && portalMediaRecorder.state !== 'inactive') {
          portalMediaRecorder.stop();
        }
        clearInterval(portalRecordInterval);
        isPortalRecording = false;

        document.getElementById('portalRecBadge').classList.add('hidden');
        const btn = document.getElementById('portalRecordBtn');
        btn.classList.remove('bg-amber-500', 'hover:bg-amber-400', 'text-slate-950');
        btn.classList.add('bg-rose-600', 'hover:bg-rose-500', 'text-white');
        document.getElementById('portalRecordText').innerText = 'Record Again';
        document.getElementById('portalRecordIcon').classList.remove('rounded-sm');
      }
    }

    function updatePortalRecordDisplay() {
      const mins = Math.floor(portalRecordSeconds / 60);
      const secs = portalRecordSeconds % 60;
      document.getElementById('portalRecTimer').innerText = 
        String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
    }

    function resetPortalAudioRecording() {
      if (portalMediaRecorder && portalMediaRecorder.state !== 'inactive') {
        portalMediaRecorder.stop();
      }
      clearInterval(portalRecordInterval);
      isPortalRecording = false;
      portalRecordSeconds = 0;
      updatePortalRecordDisplay();

      document.getElementById('portalRecBadge').classList.add('hidden');
      document.getElementById('portalResetBtn').classList.add('hidden');
      document.getElementById('portalAudioContainer').classList.add('hidden');

      const btn = document.getElementById('portalRecordBtn');
      btn.classList.remove('bg-amber-500', 'hover:bg-amber-400', 'text-slate-950');
      btn.classList.add('bg-rose-600', 'hover:bg-rose-500', 'text-white');
      document.getElementById('portalRecordText').innerText = 'Start Recording';
      document.getElementById('portalRecStatus').innerText = 'Click "Start Recording" to capture your speech directly in the browser.';
    }

    function copyPortalNote(wk) {
      const text = `Hi Lewis! Here is my Week ${wk} spontaneous sprint. Looking forward to your feedback!`;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('portalCopyBtn');
        btn.innerText = "✓ Copied!";
        setTimeout(() => { btn.innerText = "📋 Copy"; }, 2500);
      });
    }

    // Initialize on page load
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
