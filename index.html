    // INTONATION DEVICE CONTROLLER
    function switchIntonationScenario(sIdx) {
      currentScenarioIdx = sIdx;
      const sc = intonationScenarios[sIdx];
      currentStressedWordIdx = sc.stressableIndices[0];

    function selectStressedWord(wIdx) {
      currentStressedWordIdx = wIdx;
      exploredTracker.add(`${currentScenarioIdx}_${wIdx}`);
      renderIntonationDevice();
    }

    function renderIntonationDevice() {
      const container = document.getElementById("intonationInteractiveContainer");
      if (!container) return;

      const sc = intonationScenarios[currentScenarioIdx];
      const variation = sc.variations[currentStressedWordIdx] || sc.variations[sc.stressableIndices[0]];
      
      // Update badge count
      const totalPossible = sc.stressableIndices.length;
      let exploredCount = 0;
      sc.stressableIndices.forEach(idx => {
        if (exploredTracker.has(`${currentScenarioIdx}_${idx}`)) exploredCount++;
      });
      const badge = document.getElementById("discoveryBadge");
      if (badge) badge.innerText = `Explored: ${exploredCount} of ${totalPossible} nuances`;

      container.innerHTML = `
        <!-- Interactive Sentence Word Tokens -->
        <div class="bg-slate-100 border border-slate-300 rounded-xl p-5 mb-5 shadow-inner">
          <div class="text-[11px] font-bold text-slate-600 uppercase tracking-wider mb-2 flex items-center justify-between">

                  isSelected 
                    ? 'bg-indigo-600 text-white shadow-md ring-4 ring-indigo-200 scale-105 border border-indigo-700' 
                    : 'bg-white text-slate-800 border border-slate-300 hover:border-indigo-400 hover:bg-indigo-50 shadow-sm'

                  <span class="text-base">${w}</span>
                  ${isSelected ? `<span class="text-[9px] uppercase tracking-wider font-mono text-indigo-100 mt-0.5">↑ Stress</span>` : `<span class="text-[9px] text-slate-400 font-mono mt-0.5">&nbsp;</span>`}

            </div>
            <button onclick="playIntonationAcoustic()" class="px-3.5 py-1.5 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-xs font-semibold transition flex items-center gap-1.5 shadow-sm">

    // Play pitch contour chimes using Web Audio API + SpeechSynthesis
    function playIntonationAcoustic() {
      const sc = intonationScenarios[currentScenarioIdx];
      const stressedIdx = currentStressedWordIdx;

      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          const ctx = new AudioCtx();
          let time = ctx.currentTime + 0.05;

          sc.words.forEach((w, idx) => {
            if (!sc.stressableIndices.includes(idx)) return;
            const isStressed = idx === stressedIdx;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = isStressed ? 'triangle' : 'sine';
            const dur = isStressed ? 0.38 : 0.18;
            const freq = isStressed ? 360 : (idx > stressedIdx ? 170 : 220);

            osc.frequency.setValueAtTime(freq, time);
            if (isStressed) {
              osc.frequency.exponentialRampToValueAtTime(220, time + dur);
            }

            gain.gain.setValueAtTime(0.001, time);
            gain.gain.exponentialRampToValueAtTime(isStressed ? 0.28 : 0.09, time + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.001, time + dur);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start(time);
            osc.stop(time + dur);

            time += dur + 0.06;
          });
        }
      } catch (err) {
        console.log(err);
      }

      if (window.speechSynthesis) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(sc.sentenceText);
        const voices = window.speechSynthesis.getVoices();
        const ukVoice = voices.find(v => v.lang === 'en-GB' || v.name.includes('UK') || v.name.includes('British') || v.name.includes('English'));
        if (ukVoice) utterance.voice = ukVoice;
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      }
    }

    function toggleHint(className) {
      document.querySelectorAll('.' + className).forEach(el => el.classList.toggle('hidden'));
    }

    // Sprint Timer Logic
    let sprintTimer = null;
    let sprintSecs = 30;
    let isSprintRunning = false;

    function startSprintClock(s) {
      clearInterval(sprintTimer);
      isSprintRunning = false;
      sprintSecs = s;
      updateSprintClockDisplay();
      toggleSprintClock();
    }

    function updateSprintClockDisplay() {
      const mins = Math.floor(sprintSecs / 60);
      const secs = sprintSecs % 60;
      const el = document.getElementById('sprintClock');
      if (el) el.innerText = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
    }

    function toggleSprintClock() {
      const btn = document.getElementById('sprintClockBtn');
      if (!btn) return;
      if (isSprintRunning) {
        clearInterval(sprintTimer);
        isSprintRunning = false;
        btn.innerText = 'Resume';
      } else {
        isSprintRunning = true;
        btn.innerText = 'Pause';
        sprintTimer = setInterval(() => {
          if (sprintSecs > 0) {
            sprintSecs--;
            updateSprintClockDisplay();
          } else {
            clearInterval(sprintTimer);
            isSprintRunning = false;
            btn.innerText = 'Done!';
            alert('⏰ 30-Second Sprint Complete! Well done keeping the forward flow.');
          }
        }, 1000);
      }
    }

    // Live Audio Recorder (HTML5 MediaRecorder)
    let mediaRecorder = null;
    let audioChunks = [];
    let recTimerInterval = null;
    let recSeconds = 0;
    let isRecording = false;

    async function toggleRecording() {
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          let mimeType = 'audio/webm';
          if (!MediaRecorder.isTypeSupported('audio/webm')) {
            if (MediaRecorder.isTypeSupported('audio/mp4')) mimeType = 'audio/mp4';
            else mimeType = '';
          }
          mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = e => {
            if (e.data && e.data.size > 0) audioChunks.push(e.data);
          };

          mediaRecorder.onstop = () => {
            const blobType = mediaRecorder.mimeType || 'audio/webm';
            const audioBlob = new Blob(audioChunks, { type: blobType });
            const audioUrl = URL.createObjectURL(audioBlob);

            const audioEl = document.getElementById('audioElement');
            if (audioEl) audioEl.src = audioUrl;

            const dl = document.getElementById('downloadBtn');
            if (dl) dl.href = audioUrl;

            const pContainer = document.getElementById('playbackContainer');
            if (pContainer) pContainer.classList.remove('hidden');

            const status = document.getElementById('recStatus');
            if (status) status.innerText = '✓ Recording complete. Listen or download below to upload to Preply!';

            stream.getTracks().forEach(t => t.stop());
          };

          mediaRecorder.start();
          isRecording = true;
          recSeconds = 0;
          updateRecTimer();

          document.getElementById('liveRecBadge')?.classList.remove('hidden');
          document.getElementById('resetRecBtn')?.classList.remove('hidden');
          document.getElementById('playbackContainer')?.classList.add('hidden');

          const btn = document.getElementById('mainRecBtn');
          if (btn) {
            btn.classList.remove('bg-rose-600', 'hover:bg-rose-500');
            btn.classList.add('bg-rose-700', 'hover:bg-rose-600');
            document.getElementById('recText').innerText = 'Stop Recording';
            document.getElementById('recDot').classList.add('rounded-sm');
          }
          const status = document.getElementById('recStatus');
          if (status) status.innerText = '🔴 Recording live audio... Speak naturally!';

          recTimerInterval = setInterval(() => {
            recSeconds++;
            updateRecTimer();
          }, 1000);

        } catch (err) {
          alert('Microphone access is required to record audio. Please allow microphone permissions in your browser.');
        }
      } else {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        }
        clearInterval(recTimerInterval);
        isRecording = false;

        document.getElementById('liveRecBadge')?.classList.add('hidden');
        const btn = document.getElementById('mainRecBtn');
        if (btn) {
          btn.classList.remove('bg-rose-700', 'hover:bg-rose-600');
          btn.classList.add('bg-rose-600', 'hover:bg-rose-500');
          document.getElementById('recText').innerText = 'Record Again';
          document.getElementById('recDot').classList.remove('rounded-sm');
        }
      }
    }

    function updateRecTimer() {
      const mins = Math.floor(recSeconds / 60);
      const secs = recSeconds % 60;
      const el = document.getElementById('recTimer');
      if (el) el.innerText = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
    }

    function resetRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      clearInterval(recTimerInterval);
      isRecording = false;
      recSeconds = 0;
      updateRecTimer();

      document.getElementById('liveRecBadge')?.classList.add('hidden');
      document.getElementById('resetRecBtn')?.classList.add('hidden');
      document.getElementById('playbackContainer')?.classList.add('hidden');

      const btn = document.getElementById('mainRecBtn');
      if (btn) {
        btn.classList.remove('bg-rose-700', 'hover:bg-rose-600');
        btn.classList.add('bg-rose-600', 'hover:bg-rose-500');
        document.getElementById('recText').innerText = 'Start Recording';
      }
      const status = document.getElementById('recStatus');
      if (status) status.innerText = 'Click below to record your voice note directly in your browser.';
    }

    function copyPreplyNote() {
      const text = "Hi Lewis! Here is my Week 1 spontaneous speech sprint. Looking forward to your feedback!";
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copyBtn');
        if (btn) {
          btn.innerText = "✓ Copied!";
          setTimeout(() => { btn.innerText = "Copy"; }, 2500);
        }
      });
    }

    // Auto-save logic
    function saveCheck(id, checked) {
      localStorage.setItem('alicia_balanced_chk_' + id, checked ? 'true' : 'false');
    }

    function loadStoredData() {
      document.querySelectorAll('input[type="text"]').forEach(el => {
        const val = localStorage.getItem('alicia_balanced_' + el.id);
        if (val) el.value = val;
        el.addEventListener('input', () => {
          localStorage.setItem('alicia_balanced_' + el.id, el.value);
        });
      });

      document.querySelectorAll('input[type="checkbox"]').forEach(el => {
        const val = localStorage.getItem('alicia_balanced_chk_' + el.id);
        if (val === 'true') el.checked = true;
      });
    }

    window.addEventListener('DOMContentLoaded', init);
